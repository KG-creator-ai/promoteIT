name: Release — tag v* builds dist + GitHub Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: Package dist
        run: |
          cd dist && zip -r ../promote-it-${{ github.ref_name }}.zip . && cd ..
          node .spec-graph/ops/report.mjs PHASE-07 > RELEASE-REPORT-${{ github.ref_name }}.md || true

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            promote-it-*.zip
            RELEASE-REPORT-*.md
          generate_release_notes: true
