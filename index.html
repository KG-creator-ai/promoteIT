<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />

    <!-- Platform Primary Identity & White-Label Meta -->

    <meta name="mobile-web-app-capable" content="yes" />

    <link rel="shortcut icon" href="/favicon.ico" />
